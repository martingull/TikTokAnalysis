version: '3'

vars:
  APK: '{{.APK | default "TikTok_39.2.1_APKPure.apk"}}'
  REPORT: '{{.REPORT | default "tik_tok_report.json"}}'
  DECOMPILE_DIR: '{{.DECOMPILE_DIR | default "tiktok_decompiled"}}'
  JADX_DIR: '{{.JADX_DIR | default "jadx_decompiled"}}'
  JADX_SELECTED_DIR: '{{.JADX_SELECTED_DIR | default "jadx_selected"}}'
  JADX_CLASS: '{{.JADX_CLASS | default ""}}'
  INVENTORY: '{{.INVENTORY | default "reconstruction_inventory.json"}}'
  INVENTORY_MD: '{{.INVENTORY_MD | default "reconstruction_inventory.md"}}'
  SOURCE_FINDINGS: '{{.SOURCE_FINDINGS | default "source_findings.json"}}'
  SOURCE_FINDINGS_MD: '{{.SOURCE_FINDINGS_MD | default "source_findings.md"}}'
  REPORT_MD: '{{.REPORT_MD | default "privacy_assessment_report.md"}}'
  EVIDENCE_MD: '{{.EVIDENCE_MD | default "privacy_evidence_brief.md"}}'
  PROMPT_MD: '{{.PROMPT_MD | default "privacy_report_prompt_payload.md"}}'
  MODEL: '{{.MODEL | default "gpt-5.5"}}'
  PYTHON: '{{.PYTHON | default ".venv/bin/python"}}'

tasks:
  default:
    desc: List available workflows
    cmds:
      - task --list

  setup:
    desc: Sync Python dependencies with uv
    preconditions:
      - sh: command -v uv
        msg: uv is required. Install uv before running this task.
    cmds:
      - uv sync

  check:
    desc: Compile the project Python scripts
    preconditions:
      - sh: test -x "{{.PYTHON}}"
        msg: Python interpreter not found. Run task setup first or set PYTHON=/path/to/python.
    cmds:
      - '"{{.PYTHON}}" -m compileall androguard_analysis.py apk_analysis.py dashboard.py llm_analysis.py main.py promps.py reconstruction_inventory.py report_builder.py prompted_report.py openai_helpers.py source_findings.py'

  test:
    desc: Run the local unit tests
    preconditions:
      - sh: test -x "{{.PYTHON}}"
        msg: Python interpreter not found. Run task setup first or set PYTHON=/path/to/python.
    cmds:
      - '"{{.PYTHON}}" -m unittest discover -s tests'

  path1-check:
    desc: Verify the Androguard structured-analysis path against REPORT={{.REPORT}}
    cmds:
      - task: check
        vars:
          PYTHON: '{{.PYTHON}}'
      - task: test
        vars:
          PYTHON: '{{.PYTHON}}'
      - task: dashboard
        vars:
          REPORT: '{{.REPORT}}'

  roadmap:
    desc: Print the project roadmap
    cmds:
      - sed -n '1,260p' ROADMAP.md

  analyze:
    desc: Generate an Androguard JSON report from APK={{.APK}}
    preconditions:
      - sh: test -f "{{.APK}}"
        msg: APK file not found. Set APK=/path/to/app.apk.
    cmds:
      - '"{{.PYTHON}}" androguard_analysis.py "{{.APK}}" -o "{{.REPORT}}"'

  dashboard:
    desc: Render the terminal dashboard for REPORT={{.REPORT}}
    preconditions:
      - sh: test -f "{{.REPORT}}"
        msg: Report file not found. Run task analyze first or set REPORT=/path/to/report.json.
    cmds:
      - '"{{.PYTHON}}" dashboard.py "{{.REPORT}}"'

  report:
    desc: Generate the Androguard report and render it in the dashboard
    cmds:
      - task: analyze
        vars:
          APK: '{{.APK}}'
          REPORT: '{{.REPORT}}'
      - task: dashboard
        vars:
          REPORT: '{{.REPORT}}'

  privacy-indication:
    desc: Fast privacy indication from Androguard only for APK={{.APK}}
    cmds:
      - task: analyze
        vars:
          APK: '{{.APK}}'
          REPORT: '{{.REPORT}}'
      - task: dashboard
        vars:
          REPORT: '{{.REPORT}}'
      - '"{{.PYTHON}}" report_builder.py -a "{{.REPORT}}" -o "{{.EVIDENCE_MD}}"'

  llm:
    desc: Generate an LLM-assisted report from REPORT={{.REPORT}} using OpenAI SDK env vars
    preconditions:
      - sh: test -f "{{.REPORT}}"
        msg: Report JSON not found. Run task analyze first or set REPORT=/path/to/report.json.
      - sh: test -f .env
        msg: .env not found. Create it from .env.template with OpenAI SDK settings.
    cmds:
      - '"{{.PYTHON}}" llm_analysis.py -i "{{.REPORT}}" -o llm_analysis.md --model "{{.MODEL}}"'

  decompile:
    desc: Decompile APK={{.APK}} into DECOMPILE_DIR={{.DECOMPILE_DIR}} with apktool
    preconditions:
      - sh: command -v apktool
        msg: apktool is required for decompilation.
      - sh: test -f "{{.APK}}"
        msg: APK file not found. Set APK=/path/to/app.apk.
    cmds:
      - apktool d "{{.APK}}" -o "{{.DECOMPILE_DIR}}" -f

  jadx:
    desc: Decompile APK={{.APK}} into JADX_DIR={{.JADX_DIR}} with JADX Java-like source
    preconditions:
      - sh: command -v jadx
        msg: jadx is required for Java-like reconstruction. Install jadx, for example with `brew install jadx` on macOS.
      - sh: test -f "{{.APK}}"
        msg: APK file not found. Set APK=/path/to/app.apk.
    cmds:
      - jadx -d "{{.JADX_DIR}}" "{{.APK}}"

  jadx-class:
    desc: Decompile one class from APK={{.APK}} with JADX_CLASS=com.example.ClassName
    preconditions:
      - sh: command -v jadx
        msg: jadx is required for targeted Java-like reconstruction.
      - sh: test -f "{{.APK}}"
        msg: APK file not found. Set APK=/path/to/app.apk.
      - sh: test -n "{{.JADX_CLASS}}"
        msg: Set JADX_CLASS=com.example.ClassName.
    cmds:
      - |
        class_path="$(printf '%s' "{{.JADX_CLASS}}" | tr '.' '/')"
        output="{{.JADX_SELECTED_DIR}}/${class_path}.java"
        mkdir -p "$(dirname "$output")" .jadx_config .jadx_cache .jadx_tmp
        JADX_CONFIG_DIR=.jadx_config JADX_CACHE_DIR=.jadx_cache JADX_TMP_DIR=.jadx_tmp \
          jadx -r --single-class "{{.JADX_CLASS}}" --single-class-output "$output" "{{.APK}}"

  corpus-stats:
    desc: Summarize the decompiled corpus size for reconstruction planning
    preconditions:
      - sh: test -d "{{.DECOMPILE_DIR}}"
        msg: Decompiled directory not found. Run task decompile first or set DECOMPILE_DIR=/path/to/decompiled.
    cmds:
      - du -sh "{{.DECOMPILE_DIR}}"
      - find "{{.DECOMPILE_DIR}}" -maxdepth 1 -type d -name 'smali*' | wc -l
      - find "{{.DECOMPILE_DIR}}" -type f -name '*.smali' | wc -l
      - find "{{.DECOMPILE_DIR}}" -type f | wc -l
      - find "{{.DECOMPILE_DIR}}/lib" -type f | wc -l
      - find "{{.DECOMPILE_DIR}}/assets" -type f | wc -l
      - find "{{.DECOMPILE_DIR}}/res" -type f | wc -l

  privacy-keywords:
    desc: Count privacy and reconstruction keywords in decompiled smali
    preconditions:
      - sh: test -d "{{.DECOMPILE_DIR}}"
        msg: Decompiled directory not found. Run task decompile first or set DECOMPILE_DIR=/path/to/decompiled.
      - sh: command -v rg
        msg: ripgrep is required for fast keyword scans.
    cmds:
      - |
        for p in \
          'getDeviceId' \
          'getSubscriberId' \
          'getSimSerialNumber' \
          'getLastKnownLocation' \
          'getLatitude' \
          'getLongitude' \
          'getAccounts' \
          'getInstalledPackages' \
          'getMacAddress' \
          'getAdvertisingIdInfo' \
          'System.loadLibrary' \
          'DexClassLoader' \
          'Runtime;->exec' \
          'ProcessBuilder;->start' \
          'SharedPreferences'; do
            printf '%s ' "$p"
            rg -F --count-matches "$p" "{{.DECOMPILE_DIR}}" -g '*.smali' | awk -F: '{s+=$2} END{print s+0}'
          done

  inventory:
    desc: Generate reconstruction inventory artifacts from DECOMPILE_DIR={{.DECOMPILE_DIR}}
    preconditions:
      - sh: test -d "{{.DECOMPILE_DIR}}"
        msg: Decompiled directory not found. Run task decompile first or set DECOMPILE_DIR=/path/to/decompiled.
    cmds:
      - '"{{.PYTHON}}" reconstruction_inventory.py "{{.DECOMPILE_DIR}}" -o "{{.INVENTORY}}" -m "{{.INVENTORY_MD}}"'

  source-findings:
    desc: Build source reconstruction review packets from INVENTORY={{.INVENTORY}}
    preconditions:
      - sh: test -d "{{.DECOMPILE_DIR}}"
        msg: Decompiled directory not found. Run task decompile first or set DECOMPILE_DIR=/path/to/decompiled.
      - sh: test -f "{{.INVENTORY}}"
        msg: Reconstruction inventory not found. Run task inventory first or set INVENTORY=/path/to/inventory.json.
    cmds:
      - |
        if test -d "{{.JADX_DIR}}"; then
          "{{.PYTHON}}" source_findings.py -i "{{.INVENTORY}}" -d "{{.DECOMPILE_DIR}}" -j "{{.JADX_DIR}}" -o "{{.SOURCE_FINDINGS}}" -m "{{.SOURCE_FINDINGS_MD}}"
        else
          "{{.PYTHON}}" source_findings.py -i "{{.INVENTORY}}" -d "{{.DECOMPILE_DIR}}" -o "{{.SOURCE_FINDINGS}}" -m "{{.SOURCE_FINDINGS_MD}}"
        fi

  report-draft:
    desc: Generate a prompted privacy report from REPORT={{.REPORT}} and INVENTORY={{.INVENTORY}}
    preconditions:
      - sh: test -f "{{.REPORT}}"
        msg: Report JSON not found. Run task analyze first or set REPORT=/path/to/report.json.
      - sh: test -f "{{.INVENTORY}}"
        msg: Reconstruction inventory not found. Run task inventory first or set INVENTORY=/path/to/inventory.json.
      - sh: test -f .env
        msg: .env not found. Create it from .env.template with OpenAI SDK settings.
    cmds:
      - |
        if test -f "{{.SOURCE_FINDINGS}}"; then
          "{{.PYTHON}}" prompted_report.py -a "{{.REPORT}}" -i "{{.INVENTORY}}" -s "{{.SOURCE_FINDINGS}}" -o "{{.REPORT_MD}}" --evidence-output "{{.EVIDENCE_MD}}" --prompt-output "{{.PROMPT_MD}}" --model "{{.MODEL}}"
        else
          "{{.PYTHON}}" prompted_report.py -a "{{.REPORT}}" -i "{{.INVENTORY}}" -o "{{.REPORT_MD}}" --evidence-output "{{.EVIDENCE_MD}}" --prompt-output "{{.PROMPT_MD}}" --model "{{.MODEL}}"
        fi

  report-prompt:
    desc: Generate the prompted report payload locally without calling a model
    preconditions:
      - sh: test -f "{{.REPORT}}"
        msg: Report JSON not found. Run task analyze first or set REPORT=/path/to/report.json.
      - sh: test -f "{{.INVENTORY}}"
        msg: Reconstruction inventory not found. Run task inventory first or set INVENTORY=/path/to/inventory.json.
    cmds:
      - |
        if test -f "{{.SOURCE_FINDINGS}}"; then
          "{{.PYTHON}}" prompted_report.py -a "{{.REPORT}}" -i "{{.INVENTORY}}" -s "{{.SOURCE_FINDINGS}}" -o "{{.REPORT_MD}}" --evidence-output "{{.EVIDENCE_MD}}" --prompt-output "{{.PROMPT_MD}}" --model "{{.MODEL}}" --dry-run
        else
          "{{.PYTHON}}" prompted_report.py -a "{{.REPORT}}" -i "{{.INVENTORY}}" -o "{{.REPORT_MD}}" --evidence-output "{{.EVIDENCE_MD}}" --prompt-output "{{.PROMPT_MD}}" --model "{{.MODEL}}" --dry-run
        fi

  report-evidence:
    desc: Generate the deterministic evidence brief without using an LLM
    preconditions:
      - sh: test -f "{{.REPORT}}"
        msg: Report JSON not found. Run task analyze first or set REPORT=/path/to/report.json.
      - sh: test -f "{{.INVENTORY}}"
        msg: Reconstruction inventory not found. Run task inventory first or set INVENTORY=/path/to/inventory.json.
    cmds:
      - |
        if test -f "{{.SOURCE_FINDINGS}}"; then
          "{{.PYTHON}}" report_builder.py -a "{{.REPORT}}" -i "{{.INVENTORY}}" -s "{{.SOURCE_FINDINGS}}" -o "{{.EVIDENCE_MD}}"
        else
          "{{.PYTHON}}" report_builder.py -a "{{.REPORT}}" -i "{{.INVENTORY}}" -o "{{.EVIDENCE_MD}}"
        fi

  milestone:
    desc: Run first milestone artifacts from REPORT={{.REPORT}} and DECOMPILE_DIR={{.DECOMPILE_DIR}}
    cmds:
      - task: dashboard
        vars:
          REPORT: '{{.REPORT}}'
      - task: inventory
        vars:
          DECOMPILE_DIR: '{{.DECOMPILE_DIR}}'
          INVENTORY: '{{.INVENTORY}}'
          INVENTORY_MD: '{{.INVENTORY_MD}}'
      - task: source-findings
        vars:
          DECOMPILE_DIR: '{{.DECOMPILE_DIR}}'
          JADX_DIR: '{{.JADX_DIR}}'
          INVENTORY: '{{.INVENTORY}}'
          SOURCE_FINDINGS: '{{.SOURCE_FINDINGS}}'
          SOURCE_FINDINGS_MD: '{{.SOURCE_FINDINGS_MD}}'
      - task: report-draft
        vars:
          REPORT: '{{.REPORT}}'
          INVENTORY: '{{.INVENTORY}}'
          REPORT_MD: '{{.REPORT_MD}}'

  privacy-assessment:
    desc: Full static privacy assessment package for APK={{.APK}}
    cmds:
      - task: analyze
        vars:
          APK: '{{.APK}}'
          REPORT: '{{.REPORT}}'
      - task: decompile
        vars:
          APK: '{{.APK}}'
          DECOMPILE_DIR: '{{.DECOMPILE_DIR}}'
      - task: inventory
        vars:
          DECOMPILE_DIR: '{{.DECOMPILE_DIR}}'
          INVENTORY: '{{.INVENTORY}}'
          INVENTORY_MD: '{{.INVENTORY_MD}}'
      - task: source-findings
        vars:
          DECOMPILE_DIR: '{{.DECOMPILE_DIR}}'
          JADX_DIR: '{{.JADX_DIR}}'
          INVENTORY: '{{.INVENTORY}}'
          SOURCE_FINDINGS: '{{.SOURCE_FINDINGS}}'
          SOURCE_FINDINGS_MD: '{{.SOURCE_FINDINGS_MD}}'
      - task: report-draft
        vars:
          REPORT: '{{.REPORT}}'
          INVENTORY: '{{.INVENTORY}}'
          REPORT_MD: '{{.REPORT_MD}}'

  apk-scan:
    desc: Run apk_analysis.py decompile and smali keyword scan for APK={{.APK}}
    preconditions:
      - sh: command -v apktool
        msg: apktool is required by apk_analysis.py.
      - sh: test -f "{{.APK}}"
        msg: APK file not found. Set APK=/path/to/app.apk.
    cmds:
      - '"{{.PYTHON}}" apk_analysis.py "{{.APK}}" -d "{{.DECOMPILE_DIR}}" -o apk_code_scan.json'

  run:
    desc: Run the placeholder Python entrypoint
    cmds:
      - '"{{.PYTHON}}" main.py'
